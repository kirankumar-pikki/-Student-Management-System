{% extends "base.html" %}
{% block title %}Edit Course - Student Management System{% endblock %}
{% block page_title %}Edit Course{% endblock %}
{% block content %}

<div class="panel form-panel">
  <form method="POST" class="grid-form">
    <div class="form-group">
      <label for="code">Course Code *</label>
      <input type="text" id="code" name="code" value="{{ course.code }}" required>
    </div>
    <div class="form-group">
      <label for="name">Course Name *</label>
      <input type="text" id="name" name="name" value="{{ course.name }}" required>
    </div>
    <div class="form-group">
      <label for="department">Department *</label>
      <select id="department" name="department" required>
        {% for d in departments %}
          <option value="{{ d }}" {{ 'selected' if d == course.department }}>{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="credits">Credits *</label>
      <input type="number" id="credits" name="credits" min="1" max="10" value="{{ course.credits }}" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('courses') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
