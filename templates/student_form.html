{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'Add' }} Student - Student Management System{% endblock %}
{% block page_title %}{{ 'Edit Student' if mode == 'edit' else 'Add Student' }}{% endblock %}
{% block content %}

<div class="panel form-panel">
  <form method="POST" class="grid-form" novalidate>
    <div class="form-group">
      <label for="roll_no">Student ID / Roll Number *</label>
      <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no if student else '' }}" required>
    </div>
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" value="{{ student.name if student else '' }}" required>
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" value="{{ student.email if student else '' }}" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ student.phone if student else '' }}">
    </div>
    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select</option>
        {% for g in ['Male', 'Female', 'Other'] %}
          <option value="{{ g }}" {{ 'selected' if student and student.gender == g }}>{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" value="{{ student.dob if student else '' }}">
    </div>
    <div class="form-group">
      <label for="department">Department *</label>
      <select id="department" name="department" required>
        <option value="">Select</option>
        {% for d in departments %}
          <option value="{{ d }}" {{ 'selected' if student and student.department == d }}>{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="year">Year *</label>
      <select id="year" name="year" required>
        <option value="">Select</option>
        {% for y in years %}
          <option value="{{ y }}" {{ 'selected' if student and student.year|string == y|string }}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="semester">Semester *</label>
      <select id="semester" name="semester" required>
        <option value="">Select</option>
        {% for sem in semesters %}
          <option value="{{ sem }}" {{ 'selected' if student and student.semester|string == sem|string }}>{{ sem }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group form-group-wide">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3">{{ student.address if student else '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if mode == 'edit' else 'Add Student' }}</button>
      <a href="{{ url_for('students') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
